version: '3.8'
services:
#database service
    db:
        image: postgres:15
        container_name: ai-platform-db
        restart: always
        environment:
            POSTGRES_USER: DB_admin
            POSTGRES_PASSWORD: admin123
            POSTGRES_DB: ai_platform_db
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
volumes:
    postgres_data:
