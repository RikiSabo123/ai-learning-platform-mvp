services:
  # database service
  db:
    image: postgres:15
    container_name: ai-platform-db
    restart: always
    environment:
      POSTGRES_USER: DB_admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: ai_platform_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U DB_admin -d ai_platform_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # backend service
  app:
    build: ./backend       
    container_name: ai-platform-backend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    env_file:
      - ./backend/.env
    environment:
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    command: >
      sh -c "npx sequelize db:migrate --config src/config/config.json --migrations-path db/migrations ; 
             npx sequelize db:seed:all --config src/config/config.json --seeders-path db/seeders ; 
             node src/app.js"
    depends_on:
      db:
        condition: service_healthy

  # frontend service
  frontend:
    build:
      context: ./frontend 
      dockerfile: Dockerfile
    ports:
      - "5173:5173" 
    volumes:
      - ./frontend:/app 
      - /app/node_modules 
    environment:
      - CHOKIDAR_USECHOKIDAR=true

volumes:
  postgres_data: