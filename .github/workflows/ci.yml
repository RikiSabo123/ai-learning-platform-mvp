name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run that is still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: frontend (lint · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: backend (install · syntax check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Syntax check every backend file
        run: find src db -name '*.js' -print0 | xargs -0 -n1 node --check

  docker:
    name: docker compose (build · smoke test)
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create a CI-only .env (dummy values, no real secrets)
        run: |
          cat > backend/.env <<'EOF'
          PORT=3000
          DB_HOST=db
          DB_PORT=5432
          DB_NAME=ai_platform_db
          DB_USER=DB_admin
          DB_PASSWORD=admin123
          OPENAI_API_KEY=ci-dummy-key
          JWT_SECRET=ci-only-secret
          JWT_EXPIRES_IN=1h
          ADMIN_PHONE=admin
          ADMIN_NAME=Admin
          ADMIN_ROLE=admin
          NODE_ENV=development
          EOF

      - name: Build and start the full stack
        run: docker compose up -d --build

      - name: Wait for the API to answer
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/ | grep -q "running"; then
              echo "API is up"; exit 0
            fi
            sleep 2
          done
          echo "API did not come up in time"; exit 1

      - name: Check that migrations and seeds ran
        run: |
          docker compose exec -T db psql -U DB_admin -d ai_platform_db -tAc \
            "SELECT count(*) FROM \"Users\" WHERE role = 'admin'" | grep -qx 1
          docker compose exec -T db psql -U DB_admin -d ai_platform_db -tAc \
            "SELECT count(*) FROM \"Categories\"" | grep -vqx 0

      - name: Check that the frontend is served
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5173/ | grep -qi "<div id=\"root\""; then
              echo "Frontend is up"; exit 0
            fi
            sleep 2
          done
          echo "Frontend did not come up in time"; exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v
